<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Neal O'Gorman</title>
  <meta name="description" content="Neal O'Gorman — AI, automation and logistics.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2304060c'/%3E%3Cpath d='M2 22 Q8 12 14 18 T26 16 Q29 15 30 12 L30 24 Q16 30 2 26 Z' fill='%232dd4bf'/%3E%3Cpath d='M4 10 L28 4' stroke='%23f472b6' stroke-width='1.6' stroke-linecap='round'/%3E%3C/svg%3E">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      background: #04060c;
      color: #e6f1f5;
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      overflow: hidden;
    }
    #scene {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: block;
    }
    .vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(ellipse at 50% 42%, transparent 0%, transparent 55%, rgba(2,4,9,.55) 100%);
      z-index: 4;
    }
    /* ---------- playing cards ---------- */
    #cards { position: fixed; inset: 0; z-index: 2; pointer-events: none; perspective: 900px; }
    .cardo {
      position: absolute;
      top: 0; left: var(--left);
      animation: rise var(--rise) linear infinite;
      animation-delay: var(--delay);
      opacity: 0;
      will-change: transform;
    }
    .cardi {
      width: 64px; height: 92px;
      border-radius: 7px;
      background: linear-gradient(160deg, #fdfdfa 0%, #eef0ea 100%);
      box-shadow: 0 0 18px rgba(125, 226, 255, .22), 0 6px 18px rgba(0,0,0,.5);
      border: 1px solid rgba(255,255,255,.65);
      position: relative;
      transform: scale(var(--scale));
      animation: tumble var(--tumble) ease-in-out infinite alternate;
      will-change: transform;
      filter: blur(var(--blur));
      font-family: Georgia, serif;
    }
    .cardi .ix { position: absolute; top: 5px; left: 6px; font-size: 13px; line-height: 1.05; text-align: center; }
    .cardi .ix2 { position: absolute; bottom: 5px; right: 6px; font-size: 13px; line-height: 1.05; text-align: center; transform: rotate(180deg); }
    .cardi .pip { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 34px; }
    .red { color: #c22a3d; } .blk { color: #1d222b; }
    @keyframes rise {
      0%   { transform: translateY(108vh) translateX(0); opacity: 0; }
      6%   { opacity: var(--op); }
      92%  { opacity: var(--op); }
      100% { transform: translateY(-16vh) translateX(var(--drift)); opacity: 0; }
    }
    @keyframes tumble {
      from { transform: scale(var(--scale)) rotate3d(1, .6, .35, calc(-1deg * var(--spin))); }
      to   { transform: scale(var(--scale)) rotate3d(.5, 1, .25, calc(1deg * var(--spin))); }
    }
    /* ---------- centre ---------- */
    .centre {
      position: fixed;
      inset: 0;
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transform: translateY(-6vh);
      text-align: center;
      pointer-events: none;
    }
    h1 {
      font-weight: 200;
      font-size: clamp(2rem, 7.5vw, 4.6rem);
      letter-spacing: .18em;
      text-indent: .18em;
      text-transform: uppercase;
      color: #f2fbff;
      text-shadow: 0 0 24px rgba(103, 232, 249, .35), 0 0 90px rgba(45, 212, 191, .25);
      animation: breathe 7s ease-in-out infinite;
    }
    @keyframes breathe {
      0%, 100% { text-shadow: 0 0 24px rgba(103,232,249,.30), 0 0 90px rgba(45,212,191,.20); }
      50%      { text-shadow: 0 0 34px rgba(103,232,249,.55), 0 0 110px rgba(244,114,182,.30); }
    }
    .beamline {
      width: min(46vw, 420px);
      height: 1px;
      margin: 1.4rem 0 1.2rem;
      background: linear-gradient(90deg, transparent, #f472b6 30%, #67e8f9 70%, transparent);
      box-shadow: 0 0 12px rgba(244, 114, 182, .55);
    }
    .whisper {
      font-size: clamp(.6rem, 1.6vw, .78rem);
      letter-spacing: .52em;
      text-indent: .52em;
      text-transform: uppercase;
      color: rgba(159, 200, 214, .72);
    }
    .mail {
      pointer-events: auto;
      margin-top: 2.6rem;
      width: 52px; height: 52px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      border: 1px solid rgba(103, 232, 249, .45);
      color: #9feaf5;
      background: rgba(8, 20, 30, .35);
      backdrop-filter: blur(4px);
      transition: box-shadow .3s, transform .3s, color .3s;
    }
    .mail:hover {
      box-shadow: 0 0 22px rgba(103, 232, 249, .6);
      transform: translateY(-2px);
      color: #ffffff;
    }
    @media (prefers-reduced-motion: reduce) {
      .cardo, .cardi, h1 { animation: none !important; }
      .cardo { opacity: var(--op); transform: translateY(var(--staticY)) !important; }
    }
  </style>
</head>
<body>
  <canvas id="scene" aria-hidden="true"></canvas>
  <div id="cards" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>

  <main class="centre">
    <h1>Neal&nbsp;O&rsquo;Gorman</h1>
    <div class="beamline" aria-hidden="true"></div>
    <p class="whisper">AI &middot; Automation &middot; Logistics</p>
    <a class="mail" href="mailto:neal@nealogorman.com" aria-label="Email Neal O'Gorman">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/>
      </svg>
    </a>
  </main>

  <script>
  (function () {
    'use strict';
    var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    /* ---------- playing cards (DOM) ---------- */
    var suits = [
      ['A', '♠', 'blk'], ['K', '♥', 'red'], ['Q', '♦', 'red'],
      ['J', '♣', 'blk'], ['10', '♠', 'blk'], ['A', '♥', 'red']
    ];
    var cardsHost = document.getElementById('cards');
    var lanes = [7, 20, 36, 58, 76, 90];
    suits.forEach(function (s, i) {
      var o = document.createElement('div');
      o.className = 'cardo';
      var deep = i % 2 === 1;
      o.style.setProperty('--left', lanes[i] + '%');
      o.style.setProperty('--rise', (38 + Math.random() * 26).toFixed(1) + 's');
      o.style.setProperty('--delay', (-Math.random() * 40).toFixed(1) + 's');
      o.style.setProperty('--drift', ((Math.random() * 14 - 7).toFixed(1)) + 'vw');
      o.style.setProperty('--op', deep ? '.5' : '.88');
      o.style.setProperty('--staticY', (12 + i * 13) + 'vh');
      var c = document.createElement('div');
      c.className = 'cardi';
      c.style.setProperty('--scale', deep ? '.62' : (0.85 + Math.random() * .25).toFixed(2));
      c.style.setProperty('--blur', deep ? '1.5px' : '0px');
      c.style.setProperty('--tumble', (6 + Math.random() * 6).toFixed(1) + 's');
      c.style.setProperty('--spin', (14 + Math.random() * 22).toFixed(0));
      c.innerHTML =
        '<div class="ix ' + s[2] + '">' + s[0] + '<br>' + s[1] + '</div>' +
        '<div class="pip ' + s[2] + '">' + s[1] + '</div>' +
        '<div class="ix2 ' + s[2] + '">' + s[0] + '<br>' + s[1] + '</div>';
      o.appendChild(c);
      cardsHost.appendChild(o);
    });

    /* ---------- canvas scene ---------- */
    var cv = document.getElementById('scene');
    var x = cv.getContext('2d');
    var W, H, DPR;
    var nodes = [], pulses = [], lasers = [];
    var px = 0, py = 0, tx = 0, ty = 0;   /* pointer parallax (eased / target) */

    function resize() {
      DPR = Math.min(window.devicePixelRatio || 1, 2);
      W = window.innerWidth; H = window.innerHeight;
      cv.width = W * DPR; cv.height = H * DPR;
      x.setTransform(DPR, 0, 0, DPR, 0, 0);
      seed();
    }

    function seed() {
      nodes = [];
      pulses = [];
      var n = Math.min(110, Math.max(40, Math.round(W * H / 16000)));
      for (var i = 0; i < n; i++) {
        nodes.push({
          x: Math.random() * W, y: Math.random() * H * .78,
          vx: (Math.random() - .5) * .22, vy: (Math.random() - .5) * .18
        });
      }
    }

    var LINK = 135;
    function neighbours(a) {
      var out = [];
      for (var i = 0; i < nodes.length; i++) {
        var b = nodes[i];
        if (b === a) continue;
        var dx = a.x - b.x, dy = a.y - b.y;
        if (dx * dx + dy * dy < LINK * LINK) out.push(b);
      }
      return out;
    }

    function spawnPulse() {
      var a = nodes[(Math.random() * nodes.length) | 0];
      var ns = neighbours(a);
      if (!ns.length) return;
      var b = ns[(Math.random() * ns.length) | 0];
      pulses.push({ a: a, b: b, t: 0, dur: 700 + Math.random() * 700,
                    col: Math.random() < .5 ? '94,234,212' : '251,191,36' });
    }

    function spawnLaser() {
      var ang = Math.random() * Math.PI;
      var cx = W * (0.15 + Math.random() * 0.7), cy = H * (0.1 + Math.random() * 0.55);
      var L = Math.max(W, H) * 1.5;
      lasers.push({
        x1: cx - Math.cos(ang) * L, y1: cy - Math.sin(ang) * L,
        x2: cx + Math.cos(ang) * L, y2: cy + Math.sin(ang) * L,
        t: 0, dur: 520 + Math.random() * 380,
        col: Math.random() < .5 ? '244,114,182' : '103,232,249'
      });
    }

    function drawNet() {
      x.save();
      x.translate(px * 14, py * 10);
      x.lineWidth = 1;
      for (var i = 0; i < nodes.length; i++) {
        var a = nodes[i];
        a.x += a.vx; a.y += a.vy;
        if (a.x < -20) a.x = W + 20; if (a.x > W + 20) a.x = -20;
        if (a.y < -20) a.y = H * .78; if (a.y > H * .8) a.y = -20;
        for (var j = i + 1; j < nodes.length; j++) {
          var b = nodes[j];
          var dx = a.x - b.x, dy = a.y - b.y, d2 = dx * dx + dy * dy;
          if (d2 < LINK * LINK) {
            var al = (1 - Math.sqrt(d2) / LINK) * .16;
            x.strokeStyle = 'rgba(96,200,255,' + al.toFixed(3) + ')';
            x.beginPath(); x.moveTo(a.x, a.y); x.lineTo(b.x, b.y); x.stroke();
          }
        }
      }
      for (var k = 0; k < nodes.length; k++) {
        var n = nodes[k];
        x.fillStyle = 'rgba(140,220,255,.5)';
        x.beginPath(); x.arc(n.x, n.y, 1.1, 0, 7); x.fill();
      }
      /* pulses — freight moving along the network */
      for (var p = pulses.length - 1; p >= 0; p--) {
        var u = pulses[p]; u.t += 16.7;
        var q = u.t / u.dur;
        if (q >= 1) { pulses.splice(p, 1); continue; }
        var mx = u.a.x + (u.b.x - u.a.x) * q, my = u.a.y + (u.b.y - u.a.y) * q;
        x.fillStyle = 'rgba(' + u.col + ',' + (0.9 * (1 - Math.abs(q - .5) * 1.2)).toFixed(2) + ')';
        x.shadowColor = 'rgb(' + u.col + ')'; x.shadowBlur = 8;
        x.beginPath(); x.arc(mx, my, 2, 0, 7); x.fill();
        x.shadowBlur = 0;
      }
      x.restore();
    }

    function drawLasers() {
      x.save();
      x.globalCompositeOperation = 'lighter';
      for (var i = lasers.length - 1; i >= 0; i--) {
        var l = lasers[i]; l.t += 16.7;
        var q = l.t / l.dur;
        if (q >= 1) { lasers.splice(i, 1); continue; }
        var a = q < .18 ? q / .18 : 1 - (q - .18) / .82;
        x.strokeStyle = 'rgba(' + l.col + ',' + (a * .55).toFixed(3) + ')';
        x.lineWidth = 5; x.shadowColor = 'rgb(' + l.col + ')'; x.shadowBlur = 22;
        x.beginPath(); x.moveTo(l.x1, l.y1); x.lineTo(l.x2, l.y2); x.stroke();
        x.strokeStyle = 'rgba(255,255,255,' + (a * .8).toFixed(3) + ')';
        x.lineWidth = 1.1; x.shadowBlur = 10;
        x.beginPath(); x.moveTo(l.x1, l.y1); x.lineTo(l.x2, l.y2); x.stroke();
      }
      x.restore();
    }

    /* tsunami: layered swell, surging every ~16 s */
    function drawWave(now) {
      var t = now / 1000;
      var phase = (t % 16) - 8;
      var surge = 1 + 1.7 * Math.exp(-(phase * phase) / 2.4);
      var layers = [
        { base: .90, amp: 14, f1: .009, f2: .020, s1: .55, s2: .30, fill: 'rgba(13,120,140,.14)', crest: null },
        { base: .875, amp: 20, f1: .011, f2: .017, s1: .42, s2: .50, fill: 'rgba(20,160,175,.16)', crest: null },
        { base: .855, amp: 26, f1: .013, f2: .023, s1: .65, s2: .38, fill: 'rgba(45,212,191,.15)', crest: 'rgba(125,240,255,.5)' }
      ];
      for (var i = 0; i < layers.length; i++) {
        var L = layers[i];
        x.beginPath();
        x.moveTo(0, H);
        for (var wx = 0; wx <= W + 8; wx += 8) {
          var wy = H * L.base +
            L.amp * surge * (Math.sin(wx * L.f1 + t * L.s1) * .6 + Math.sin(wx * L.f2 - t * L.s2) * .4);
          x.lineTo(wx, wy);
        }
        x.lineTo(W, H); x.closePath();
        x.fillStyle = L.fill; x.fill();
        if (L.crest) {
          x.save();
          x.strokeStyle = L.crest; x.lineWidth = 1.4;
          x.shadowColor = 'rgba(103,232,249,.8)'; x.shadowBlur = 9;
          x.beginPath();
          for (var cx2 = 0; cx2 <= W + 8; cx2 += 8) {
            var cy2 = H * L.base +
              L.amp * surge * (Math.sin(cx2 * L.f1 + t * L.s1) * .6 + Math.sin(cx2 * L.f2 - t * L.s2) * .4);
            if (cx2 === 0) x.moveTo(cx2, cy2); else x.lineTo(cx2, cy2);
          }
          x.stroke();
          x.restore();
        }
      }
    }

    function frame(now) {
      x.fillStyle = '#04060c';
      x.fillRect(0, 0, W, H);
      px += (tx - px) * .04; py += (ty - py) * .04;
      drawNet();
      drawWave(now);
      drawLasers();
      requestAnimationFrame(frame);
    }

    window.addEventListener('resize', resize);
    window.addEventListener('pointermove', function (e) {
      tx = (e.clientX / W - .5); ty = (e.clientY / H - .5);
    });

    resize();
    if (reduced) {
      x.fillStyle = '#04060c'; x.fillRect(0, 0, W, H);
      drawNet(); drawWave(4000);
    } else {
      setInterval(spawnPulse, 420);
      setInterval(spawnLaser, 2900);
      requestAnimationFrame(frame);
    }
  })();
  </script>
</body>
</html>
